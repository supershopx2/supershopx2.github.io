<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بيع | SuperShop</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header id="top"></header>
<h1>بيع غرضك</h1><p class="sub">عندك شي جديد أو مستعمل ما تحتاجه؟ اعرضه، وإذا انقبل ينضاف سعره لرصيدك.</p>
<div class="order">
 <input id="n" maxlength="40" placeholder="شنو الغرض؟ (مثلاً: سيارة ريموت)">
 <div style="display:flex;gap:8px;margin-bottom:10px"><button class="go" id="c-new">جديد</button><button id="c-used">مستعمل</button></div>
 <input id="p" type="number" min="0.25" step="0.25" placeholder="بكم تبيعه؟ ($)">
 <input id="d" maxlength="120" placeholder="وصف قصير (اختياري)">
 <button class="pink" id="go">أرسل العرض</button>
</div>
<h2>عروضي</h2><section id="mine"></section>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="products.js"></script><script src="supabase-compat.js"></script><script src="app.js"></script>
<script>
topbar("sell"); let cond = "new";
const pick = c => { cond = c; ["new", "used"].forEach(k => document.getElementById("c-" + k).className = k == c ? "go" : ""); };
document.getElementById("c-new").onclick = () => pick("new"); document.getElementById("c-used").onclick = () => pick("used");
const ST = { pending: ["ينتظر", "s-new"], accepted: ["انقبل", "s-done"], rejected: ["انرفض", "s-del"] };
async function mine() {
  const box = document.getElementById("mine"); box.innerHTML = "";
  const ids = JSON.parse(ls("ss_offers") || "[]").reverse();
  if (!ids.length) box.innerHTML = "<p class='sub'>ما عرضت شي للحين.</p>";
  for (const id of ids) try {
    const d = (await db.collection("offers").doc(id).get()).data(), [lb, cl] = ST[d.status], e = document.createElement("div");
    e.className = "order"; e.innerHTML = `<div class="row"><b>${d.name} (${d.cond == "used" ? "مستعمل" : "جديد"})</b><span class="chip ${cl}">${lb}</span></div><div>${fmt(d.price * 100)}</div>`;
    box.appendChild(e);
  } catch (e) {}
}
document.getElementById("go").onclick = async () => {
  const name = n.value.trim(), price = parseFloat(p.value);
  if (!name || !(price > 0)) return toast("اكتب اسم الغرض وسعره", 1);
  if (!db) return toast("الموقع مو مربوط بقاعدة البيانات", 1);
  try {
    const r = await db.collection("offers").add({ name, cond, price, note: d.value.trim(), owner: NAME, status: "pending", credited: false, ts: Date.now() });
    ls("ss_offers", JSON.stringify([...JSON.parse(ls("ss_offers") || "[]"), r.id]));
    n.value = p.value = d.value = ""; sfx.ok(); toast("انرسل عرضك! انتظر الرد"); mine();
  } catch (e) { toast("ما انرسل، جرب مرة ثانية", 1); }
};
if (db) mine();
</script></body></html>
