<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المحل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top"></header>
<h1>شنو تريد اليوم؟</h1>
<p class="sub">اختار ألعابك، وإذا رصيدك قليل روح لصفحة "اشتغل".</p>
<section class="grid" id="grid"></section>

<div class="cart">
  <div><b id="count">0</b> أغراض<small>المجموع: <span id="total">0</span></small></div>
  <div><button id="clear">فضّي السلة</button> <button class="go" id="buy">اطلب الحين</button></div>
</div>
<div id="toast" role="status"></div>

<script src="products.js"></script>
<script src="app.js"></script>
<script>
topbar("shop");
const cart = {};
const grid = document.getElementById("grid");
PRODUCTS.forEach(p => {
  const d = document.createElement("div"); d.className = "item";
  d.innerHTML = `<div class="pic">${p.img ? `<img src="${p.img}" alt="${p.name}">` : p.emoji}</div>
    <h3>${p.name}</h3><div class="price">${p.price} ${CONFIG.coin}</div>
    <button>أضف للسلة</button>`;
  d.querySelector("button").onclick = () => { cart[p.id] = (cart[p.id] || 0) + 1; draw(); };
  grid.appendChild(d);
});
function lines() { return PRODUCTS.filter(p => cart[p.id]).map(p => ({ ...p, qty: cart[p.id] })); }
function draw() {
  const l = lines();
  document.getElementById("count").textContent = l.reduce((s, x) => s + x.qty, 0);
  document.getElementById("total").textContent = l.reduce((s, x) => s + x.qty * x.price, 0);
}
document.getElementById("clear").onclick = () => { for (const k in cart) delete cart[k]; draw(); };
document.getElementById("buy").onclick = () => {
  const l = lines();
  if (!l.length) return toast("السلة فاضية، أضف شي أول");
  const total = l.reduce((s, x) => s + x.qty * x.price, 0);
  if (total > getBal()) return toast(`ناقصك ${total - getBal()} ${CONFIG.coin}. روح اشتغل واكسب 💪`);
  addBal(-total);
  const msg = "طلب جديد 🛍️\n" + l.map(x => `• ${x.name} × ${x.qty}`).join("\n") +
              `\nالمجموع: ${total} ${CONFIG.coin}\nالرصيد المتبقي: ${getBal()}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
  for (const k in cart) delete cart[k]; draw();
  toast("انرسل طلبك! انتظر التوصيل 🚚");
};
draw();
</script>
</body>
</html>
