<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SuperShop</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header id="top"></header>
<h1>هلا <span class="who"></span>!</h1>
<p class="sub">اختار غرضك. رصيدك قليل؟ اشتغل على البيسي، اشحن بطاقة، أو بيع شي من أغراضك.</p>
<section class="grid" id="grid"></section>
<div class="cart"><div><b id="count">0</b> أغراض<small>المجموع: <span id="total">$0.00</span></small></div>
 <div><button id="clear">فضّي</button> <button class="go" id="buy">اطلب الحين</button></div></div>
<div id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="products.js"></script><script src="app.js"></script>
<script>
topbar("shop"); document.querySelector(".who").textContent = NAME || "";
const cart = {}, grid = document.getElementById("grid"); let LIST = PRODUCTS;
function render() {
  grid.innerHTML = "";
  LIST.forEach(p => {
    const d = document.createElement("div"); d.className = "item";
    d.innerHTML = `<div class="pic">${p.img ? `<img src="${p.img}" alt="${p.name}">` : ico(p.icon || "tag", 52)}</div><h3>${p.name}</h3>
     ${p.cond ? `<span class="chip ${p.cond == "used" ? "s-new" : "s-done"}">${p.cond == "used" ? "مستعمل" : "جديد"}</span>` : ""}
     <div class="price">${fmt(p.price * 100)}</div><button>أضف للسلة</button>`;
    d.querySelector("button").onclick = () => { cart[p.id] = (cart[p.id] || 0) + 1; sfx.add(); draw(); };
    grid.appendChild(d);
  });
  draw();
}
const lines = () => LIST.filter(p => cart[p.id]).map(p => ({ n: p.name, q: cart[p.id], p: p.price }));
const sum = () => lines().reduce((s, x) => s + Math.round(x.p * 100) * x.q, 0);
function draw() { count.textContent = lines().reduce((s, x) => s + x.q, 0); total.textContent = fmt(sum()); }
clear.onclick = () => { for (const k in cart) delete cart[k]; draw(); };
buy.onclick = async () => {
  const l = lines(), t = sum();
  if (!l.length) return toast("السلة فاضية", 1);
  if (t > getBal()) return toast(`ناقصك ${fmt(t - getBal())}. اشتغل أو اشحن بطاقة`, 1);
  if (!db) return toast("الموقع مو مربوط بقاعدة البيانات", 1);
  try {
    await db.collection("orders").add({ name: NAME, items: l, total: t / 100, status: "new", ts: Date.now() });
    addBal(-t); for (const k in cart) delete cart[k]; draw(); sfx.ok(); toast("وصل طلبك! انتظر التوصيل");
  } catch (e) { toast("ما انرسل الطلب، جرب مرة ثانية", 1); }
};
render();
if (db) db.collection("products").orderBy("ts", "desc").onSnapshot(s => { if (!s.empty) { LIST = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); } });
</script></body></html>
